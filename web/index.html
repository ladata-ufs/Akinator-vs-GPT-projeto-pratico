<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Akinator Bayesiano — DCOMP/UFS</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:20px auto;padding:0 12px;background:#10141c;color:#e8ecf3}
h1{font-size:1.4rem}.card{background:#1a2030;border-radius:10px;padding:14px;margin:12px 0}
button{padding:8px 16px;margin:4px;border:0;border-radius:6px;background:#3b82f6;color:#fff;cursor:pointer;font-size:1rem}
button.n{background:#ef4444}button.s{background:#6b7280}button.g{background:#22c55e}
.bar{display:flex;align-items:center;margin:3px 0;font-size:.85rem}.bar .l{width:300px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .b{height:12px;background:#3b82f6;border-radius:3px;transition:width .3s}.bar .v{margin-left:8px;width:50px}
.q{font-size:1.2rem;margin:8px 0}small{color:#9aa4b5}table{width:100%;font-size:.8rem}
</style></head><body>
<h1>🔮 Akinator Bayesiano — Docentes do DCOMP/UFS</h1>
<div class="card">Pense em um(a) docente. Modo:
 <select id="modo"><option value="5">5 perguntas (igual ao LLM)</option><option value="12">Livre (até 12, confiança 85%)</option></select>
 <label style="margin-left:8px;font-size:.9rem"><input type="checkbox" id="variar" checked> Variar perguntas (Top-3 Gini)</label>
 <button onclick="iniciar()">Novo jogo</button></div>
<div class="card" id="jogo"></div>
<div class="card"><b>Ranking de probabilidade</b> <small id="gini"></small><div id="rank"></div></div>
<div class="card"><b>Histórico (Regra de Bayes)</b><table id="hist"></table></div>
<script src="matriz.js"></script>
<script>
const {docentes:D,perguntas:Q}=MATRIZ, R=['sim','nao','nao_sei'];
let probs,feitas,n,hist,atual,maxq,lim=0.85;
const gini=p=>1-p.reduce((s,x)=>s+x*x,0);
function bayes(p,l){const pr=p.map((x,i)=>x*l[i]),s=pr.reduce((a,b)=>a+b,0);return s==0?[...p]:pr.map(x=>x/s)}
function melhor(){
 const c=[];
 Q.forEach((q,i)=>{if(feitas.has(i))return;let g=0;
  for(const r of R){const l=q.lik[r],pr=probs.reduce((s,x,j)=>s+x*l[j],0);if(pr>0)g+=pr*gini(bayes(probs,l))}
  c.push([g,i])});
 if(!c.length)return null;
 c.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 if(!document.getElementById('variar').checked)return c[0][1];
 const pool=n===0?c.slice(0,3):c.filter(x=>x[0]<=c[0][0]+0.002);
 return pool[Math.floor(Math.random()*pool.length)][1];
}
function parar(){return n>=maxq||Math.max(...probs)>=lim}
function iniciar(){maxq=+document.getElementById('modo').value;probs=D.map(()=>1/D.length);feitas=new Set();n=0;hist=[];proxima()}
function proxima(){if(parar()){fim();render();return}atual=melhor();if(atual==null){fim();render();return}render()}
function responder(r){const q=Q[atual],ant=gini(probs);feitas.add(atual);probs=bayes(probs,q.lik[r]);n++;
 const t=probs.map((p,i)=>[p,i]).sort((a,b)=>b[0]-a[0])[0];
 hist.push(`<tr><td>${n}</td><td>${q.texto}</td><td>${r}</td><td>Gini ${ant.toFixed(3)}→${gini(probs).toFixed(3)}</td><td>${D[t[1]].nome} ${(t[0]*100).toFixed(1)}%</td></tr>`);proxima()}
function fim(){atual=null}
function render(){const j=document.getElementById('jogo');
 if(atual==null){const t=probs.map((p,i)=>[p,i]).sort((a,b)=>b[0]-a[0])[0];
  j.innerHTML=`<div class="q">Meu palpite: <b>${D[t[1]].nome}</b> (${(t[0]*100).toFixed(1)}%)</div><small>${n} pergunta(s)</small>`}
 else j.innerHTML=`<small>Pergunta ${n+1}/${maxq}</small><div class="q">${Q[atual].texto}</div>
  <button class="g" onclick="responder('sim')">Sim</button><button class="n" onclick="responder('nao')">Não</button><button class="s" onclick="responder('nao_sei')">Não sei</button>`;
 const top=probs.map((p,i)=>[p,i]).sort((a,b)=>b[0]-a[0]).slice(0,10);
 document.getElementById('rank').innerHTML=top.map(([p,i])=>`<div class="bar"><span class="l">${D[i].nome}</span><span class="b" style="width:${p*300}px"></span><span class="v">${(p*100).toFixed(1)}%</span></div>`).join('');
 document.getElementById('gini').textContent=`— Gini: ${gini(probs).toFixed(3)}`;
 document.getElementById('hist').innerHTML=hist.join('')}
iniciar();
</script></body></html>
